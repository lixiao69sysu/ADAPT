# ADAPT 双服务器部署配置
#   3090 服务器 (4x3090):
#     GPU0+1 : agent 27B-FP8   TP=2 vLLM       :8000
#     GPU2   : 用户模拟器 9B-Q8  llama.cpp       :8002
#     GPU3   : 备用
#   4号 服务器 (8x4090):
#     GPU4-7  : 评估器 27B-AWQ-INT4  TP=4 vLLM  :8001
#       VS Code 转发到本机 localhost:57177 (served_model_name=模型路径)
# 本机通过 SSH 本地转发访问: 三个端口都在 localhost (127.0.0.1)
# 使用: VITA_MODEL_CONFIG_PATH=/path/to/models_dual_server.yaml vita run ...
# 注意: 所有三个模型条目都必须带 chat_template_kwargs.enable_thinking=false,
#       否则 Qwen3.x 默认进入 thinking 模式, content 为空、10x 变慢

default:
  api_key: local
  temperature: 0.0
  max_input_tokens: 32768

models:
  # ── agent: 2x3090 vLLM (Qwen3.5-27B-FP8, TP=2) ──
  - name: qwen35-agent
    base_url: http://localhost:8000/v1
    api_key: local
    max_tokens: 2048
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
    cost_1m_token_dollar:
      prompt_price: 0.0
      completion_price: 0.0

  # ── evaluator: 4号服务器 GPU4-7 vLLM (Qwen3.6-27B-AWQ-INT4, TP=4) ──
  #   服务器 :8001 → VS Code 转发本机 localhost:57177
  #   注意: eval prompt 实测可达 12K+ tokens, 必须配大 max-model-len(32768)
  #         且 max_tokens 不能太高, 否则 16384 窗口溢出 400 (被记 reward=0)
  - name: qwen36-evaluator
    base_url: http://localhost:57177/v1
    api_key: local
    max_tokens: 2048
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
    cost_1m_token_dollar:
      prompt_price: 0.0
      completion_price: 0.0

  # ── user sim: 3090 服务器 GPU2 llama.cpp (9B Q8) ──
  - name: qwen35-user
    base_url: http://localhost:8002/v1
    api_key: local
    max_tokens: 1024
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
    cost_1m_token_dollar:
      prompt_price: 0.0
      completion_price: 0.0

  - name: qwen35-user-gguf
    base_url: http://localhost:8002/v1
    api_key: local
    max_tokens: 1024
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
    cost_1m_token_dollar:
      prompt_price: 0.0
      completion_price: 0.0
